name: Vercel Preview Comment

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write
  deployments: read

jobs:
  comment:
    runs-on: ubuntu-latest
    if: |
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'Preview') &&
      (endsWith(github.event.deployment_status.environment_url, '.vercel.app') || contains(github.event.deployment_status.environment_url, '.vercel.app/'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { buildPreviewComment, selectPullRequest } = await import('${{ github.workspace }}/.github/preview-comment-script.mjs');
            
            const sha = github.event.deployment.sha;
            const targetUrl = github.event.deployment_status.environment_url;

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const matchedPr = selectPullRequest(pulls, sha);
            if (!matchedPr) {
              console.log(`No open pull request found matching deployment SHA: ${sha}`);
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: matchedPr.number
            });

            const marker = '<!-- portfolio-preview -->';
            const existingComment = comments.find(c => c.body.includes(marker));
            const newBody = buildPreviewComment(targetUrl);

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: newBody
              });
              console.log(`Updated comment on PR #${matchedPr.number}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: matchedPr.number,
                body: newBody
              });
              console.log(`Created comment on PR #${matchedPr.number}`);
            }
